server {
    listen 80;
    listen [::]:80;

    server_name xiaoshoufupan.woshimake.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name xiaoshoufupan.woshimake.com;

    ssl_certificate /etc/letsencrypt/live/xiaoshoufupan.woshimake.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoshoufupan.woshimake.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/xiaoshoufupan/current;
    index index.html;

    access_log /var/log/nginx/xiaoshoufupan.access.log;
    error_log /var/log/nginx/xiaoshoufupan.error.log;

    client_max_body_size 25m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
